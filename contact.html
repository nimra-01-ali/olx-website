<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | CodeVenture</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">Code<span>Venture</span></a>

            <nav class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>
            </nav>

            <button class="nav-toggle" id="navToggle">☰</button>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <div class="section-header">
                    <p class="eyebrow">Contact</p>
                    <h2>Let’s create something amazing</h2>
                </div>

                <div class="contact-grid">
                    <div class="contact-card">
                        <div class="contact-info">
                            <div class="item">
                                <div class="icon">📍</div>
                                <div>
                                    <strong>Office</strong>
                                    <p> Pakistan</p>
                                </div>
                            </div>

                            <div class="item">
                                <div class="icon">📧</div>
                                <div>
                                    <strong>Email</strong>
                                    <p>Nimrali354@gmail.com</p>
                                </div>
                            </div>

                            <div class="item">
                                <div class="icon">📞</div>
                                <div>
                                    <strong>Phone</strong>
                                    <p>+92 327-8653-792</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="contact-card">
                        <form>
                            <div class="form-group">
                                <label for="name">Your Name</label>
                                <input type="text" id="name" placeholder="Enter your name" />
                            </div>

                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" placeholder="Enter your email" />
                            </div>

                            <div class="form-group">
                                <label for="msg">Project Details</label>
                                <textarea id="msg" rows="5" placeholder="Tell us about your project"></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <p>© <span id="year"></span> CodeVenture Studio</p>
            <a href="contact.html">Nimrali354@gmail.com</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
